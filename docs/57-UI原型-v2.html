<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vellum工作台 · UI 原型 v2（层级版）</title>
<style>
/* ============================================================
   1. 令牌
   ============================================================ */
:root{
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:20px; --sp6:24px; --sp8:32px;
  --fs11:11px; --fs12:12px; --fs13:13px; --fs15:15px; --fs18:18px; --fs22:22px;
  --h:28px; --h-sm:24px; --topbar:44px; --toolbar:48px; --status:26px;
  --r4:4px; --r6:6px; --r8:8px; --r10:10px; --r14:14px;
  --font:"Segoe UI","Microsoft YaHei",-apple-system,"PingFang SC",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.3,1);
}
html[data-theme="dark"]{
  --bg:#0e0f11; --panel:#15171a; --panel2:#1b1e22; --card:#1e2126; --card2:#242830;
  --line:#26292f; --line2:#333841;
  --text:#e7e9ec; --text2:#9ba1aa; --text3:#6b7078;
  --accent:#3b82f6; --accent2:#5b96f8; --accentSoft:rgba(59,130,246,.14);
  --ok:#34a06a; --warn:#d99433; --danger:#d95a54; --purple:#8b5cf6; --teal:#14a3a3;
  --mask:rgba(8,9,11,.66);
  --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 10px 30px rgba(0,0,0,.55);
  --hl:rgba(255,255,255,.05);
  --coverLine:rgba(255,255,255,.08);
}
html[data-theme="light"]{
  --bg:#ebe8e1; --panel:#f4f1ea; --panel2:#e9e5dc; --card:#fbf9f4; --card2:#fffdf8;
  --line:#ddd7ca; --line2:#c9c2b1;
  --text:#26231e; --text2:#544e46; --text3:#6d665b;
  --accent:#1a6fd4; --accent2:#2f81e0; --accentSoft:rgba(26,111,212,.10);
  --ok:#1f7d52; --warn:#a86c11; --danger:#c23c38; --purple:#7048c8; --teal:#0d7d7d;
  --mask:rgba(38,34,26,.34);
  --sh1:0 1px 2px rgba(60,50,30,.10); --sh2:0 12px 32px rgba(60,50,30,.18);
  --hl:rgba(255,255,255,.7);
  --coverLine:rgba(0,0,0,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); font:var(--fs13)/1.5 var(--font);
  -webkit-font-smoothing:antialiased; overflow:hidden;
  font-variant-numeric:tabular-nums;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--text3);background-clip:content-box}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r4)}

/* ============================================================
   2. 控件
   ============================================================ */
.btn{
  height:var(--h); padding:0 12px; display:inline-flex; align-items:center; gap:6px;
  border-radius:var(--r6); border:1px solid var(--line2); background:var(--panel2);
  color:var(--text); white-space:nowrap; font-size:var(--fs13);
}
.btn:hover{background:var(--card2); border-color:var(--text3)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
.btn.primary:hover{background:var(--accent2); border-color:var(--accent2)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--text2)}
.btn.ghost:hover{background:var(--panel2); color:var(--text)}
.btn.sm{height:var(--h-sm); padding:0 9px; font-size:var(--fs12)}
.btn.icon{width:var(--h); padding:0; justify-content:center}
.btn.icon.sm{width:var(--h-sm)}
.iconbtn{
  width:var(--h); height:var(--h); border-radius:var(--r6); display:grid; place-items:center;
  color:var(--text2); position:relative;
}
.iconbtn:hover{background:var(--panel2); color:var(--text)}
.iconbtn.on{background:var(--accentSoft); color:var(--accent2)}
.iconbtn .tip{
  position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%) translateY(-3px);
  background:var(--card2); color:var(--text); font-size:var(--fs11); padding:4px 8px;
  border-radius:var(--r4); box-shadow:var(--sh2); border:1px solid var(--line2);
  white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .1s var(--ease),transform .1s var(--ease); z-index:80;
}
.iconbtn:hover .tip{opacity:1; transform:translateX(-50%) translateY(0)}
.tag{
  display:inline-flex;align-items:center;gap:4px;height:19px;padding:0 6px;border-radius:var(--r4);
  font-size:var(--fs11);line-height:1;white-space:nowrap;font-weight:500;
}
.tag.info{background:var(--accentSoft);color:var(--accent2)}
.tag.ok{background:rgba(52,160,106,.15);color:var(--ok)}
.tag.warn{background:rgba(217,148,51,.15);color:var(--warn)}
.tag.danger{background:rgba(217,90,84,.15);color:var(--danger)}
.tag.mute{background:var(--panel2);color:var(--text3)}
.tag.purple{background:rgba(139,92,246,.15);color:var(--purple)}
.chip{font-size:var(--fs12);color:var(--text3)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}
.search{
  height:var(--h); padding:0 10px 0 30px; border-radius:var(--r6);
  border:1px solid var(--line2); background:var(--panel2); color:var(--text);
  outline:none; min-width:0; font-size:var(--fs13);
}
.search::placeholder{color:var(--text3)}
.search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accentSoft); background:var(--panel)}
.searchwrap{position:relative;display:flex;align-items:center}
.searchwrap svg{position:absolute;left:9px;color:var(--text3);pointer-events:none}
.kbd{
  font-family:var(--mono);font-size:10px;color:var(--text3);border:1px solid var(--line2);
  border-radius:3px;padding:0 4px;line-height:14px;background:var(--panel2);
}

/* ============================================================
   3. 骨架
   ============================================================ */
.app{display:grid;grid-template-rows:var(--topbar) 1fr var(--status);height:100vh}
.topbar{
  display:flex;align-items:center;gap:var(--sp3);padding:0 var(--sp3) 0 var(--sp4);
  background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--hl);
  position:relative;z-index:30;
}
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:var(--fs13);letter-spacing:.2px;padding-right:var(--sp3);border-right:1px solid var(--line);height:22px}
.brand .logo{width:18px;height:18px;border-radius:5px;background:linear-gradient(140deg,#3b82f6,#8b5cf6 60%,#e2711d);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.brand .ver{font-size:10px;color:var(--text3);font-weight:400;margin-left:2px}
.global-search{width:240px}
.seg{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:var(--r8);border:1px solid var(--line)}
.seg button{
  height:24px;padding:0 11px;border-radius:var(--r6);font-size:var(--fs13);color:var(--text2);
  display:inline-flex;align-items:center;gap:5px;transition:background .12s var(--ease),color .12s var(--ease);
}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:var(--sh1);font-weight:600}
.seg .badge{background:var(--warn);color:#fff;font-size:10px;border-radius:8px;padding:0 4px;height:14px;display:inline-flex;align-items:center;font-weight:700}
.spacer{flex:1}
.tgroup{display:flex;align-items:center;gap:2px}
.tsep{width:1px;height:18px;background:var(--line2);margin:0 6px}

.body{display:grid;grid-template-columns:216px 1fr;min-height:0}
.sider{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sider .scroll{overflow:auto;flex:1;padding:var(--sp2) 0 var(--sp3)}
.side-sec{padding:var(--sp1) var(--sp3) var(--sp2)}
.side-h{
  display:flex;align-items:center;justify-content:space-between;
  font-size:var(--fs11);color:var(--text3);letter-spacing:.5px;font-weight:600;
  padding:var(--sp2) var(--sp1) 5px;
}
.side-h button{color:var(--text3);font-size:var(--fs12);font-weight:400}
.side-h button:hover{color:var(--text)}
.tree{display:flex;flex-direction:column;gap:1px}
.row{
  display:flex;align-items:center;gap:7px;height:27px;padding:0 7px;border-radius:var(--r4);
  color:var(--text2);font-size:var(--fs13);cursor:default;
}
.row:hover{background:var(--panel2);color:var(--text)}
.row.sel{background:var(--accentSoft);color:var(--accent2);font-weight:600}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{font-size:var(--fs11);color:var(--text3);font-weight:400}
.row.zero .nm,.row.zero .n{opacity:.5}
.row .indent{width:9px;color:var(--text3);font-size:9px}
.sider-foot{border-top:1px solid var(--line);padding:var(--sp2) var(--sp3)}
.wscard{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r8);padding:8px 9px}
.wscard .k{font-size:10px;color:var(--text3);letter-spacing:.4px}
.wscard .p{font-size:var(--fs12);color:var(--text2);margin-top:2px;word-break:break-all;line-height:1.35;max-height:32px;overflow:hidden}
.wscard .acts{display:flex;gap:6px;margin-top:7px}
.wscard .acts button{font-size:var(--fs11);color:var(--text2);border:1px solid var(--line2);border-radius:var(--r4);padding:2px 7px;background:var(--panel)}
.wscard .acts button:hover{color:var(--text);border-color:var(--text3)}

.main{display:grid;grid-template-rows:var(--toolbar) 1fr;min-height:0;position:relative;background:var(--bg)}
.toolbar{
  display:flex;align-items:center;gap:var(--sp2);padding:0 var(--sp4);
  border-bottom:1px solid var(--line);background:var(--panel);
}
.toolbar .title{display:flex;align-items:baseline;gap:8px;font-size:var(--fs15);font-weight:700;letter-spacing:.1px}
.toolbar .title .num{font-size:var(--fs12);color:var(--text3);font-weight:400}
.toolbar .title .pill{
  font-size:var(--fs11);color:var(--warn);background:rgba(217,148,51,.14);
  border-radius:9px;padding:1px 7px;font-weight:600;
}
.tools{margin-left:auto;display:flex;align-items:center;gap:6px}
.content{overflow:auto;padding:var(--sp4);position:relative}
.statusbar{
  display:flex;align-items:center;gap:var(--sp4);padding:0 var(--sp4);
  background:var(--panel);border-top:1px solid var(--line);
  font-size:var(--fs11);color:var(--text3);
}
.statusbar b{color:var(--text2);font-weight:500}
.statusbar .path{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono);font-size:10.5px}

/* ============================================================
   4. 卡片
   ============================================================ */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp3)}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r10);
  overflow:hidden;display:flex;flex-direction:column;height:184px;position:relative;
  transition:border-color .14s var(--ease),box-shadow .14s var(--ease),transform .14s var(--ease);
}
.card:hover{border-color:var(--line2);box-shadow:var(--sh2);transform:translateY(-1px)}
.card .cover{height:104px;position:relative;overflow:hidden;background:var(--panel2)}
.card .cover svg{display:block;width:100%;height:100%}
.card .cover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 -24px 28px -18px rgba(0,0,0,.55)}
.card .cover .kind{position:absolute;left:8px;top:8px;z-index:2;backdrop-filter:blur(6px);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.card .cover .chk{
  position:absolute;right:8px;top:8px;z-index:3;opacity:0;transition:opacity .12s var(--ease);
  background:rgba(12,14,17,.55);border-color:rgba(255,255,255,.55);
}
.card:hover .chk,.card .cover .chk.on{opacity:1}
.card .cover .more{
  position:absolute;right:6px;bottom:6px;z-index:3;width:24px;height:24px;border-radius:var(--r4);
  display:grid;place-items:center;color:#fff;background:rgba(12,14,17,.55);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .12s var(--ease);
}
.card:hover .cover .more{opacity:1}
.card .cover .more:hover{background:rgba(12,14,17,.8)}
.card .cb{padding:9px 11px 10px;display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}
.card .t{font-size:var(--fs13);font-weight:600;line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;letter-spacing:.1px}
.card .m{font-size:var(--fs11);color:var(--text3);display:flex;align-items:center;gap:6px}
.card .m .sep{opacity:.5}
.card .f{margin-top:auto;display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.card .prog{height:2px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:2px}
.card .prog i{display:block;height:100%;background:var(--accent);width:66%}

/* ============================================================
   5. 表格
   ============================================================ */
.filters{display:flex;align-items:center;gap:var(--sp2);padding:9px var(--sp4);border-bottom:1px solid var(--line);background:var(--panel)}
.pills{display:flex;gap:2px}
.pills button{
  height:24px;padding:0 10px;border-radius:999px;font-size:var(--fs12);color:var(--text2);
  border:1px solid transparent;display:inline-flex;align-items:center;gap:5px;
}
.pills button:hover{background:var(--panel2);color:var(--text)}
.pills button.on{background:var(--accentSoft);color:var(--accent2);border-color:rgba(59,130,246,.35);font-weight:600}
.pills .c{font-size:10px;opacity:.75}
.legend{
  display:flex;align-items:center;gap:var(--sp3);padding:6px var(--sp4);
  border-bottom:1px solid var(--line);font-size:var(--fs11);color:var(--text3);background:var(--panel);
}
.tablewrap{overflow:auto;height:100%}
table.tk{width:100%;border-collapse:separate;border-spacing:0}
table.tk th{
  position:sticky;top:0;z-index:2;background:var(--panel);text-align:left;
  font-weight:600;color:var(--text3);font-size:var(--fs11);letter-spacing:.3px;
  height:32px;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.tk td{
  height:34px;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:280px;font-size:var(--fs13);
}
table.tk th:last-child,table.tk td:last-child{padding-right:10px}
table.tk th:nth-last-child(2),table.tk td:nth-last-child(2){padding-right:18px}
table.tk tr:hover td{background:var(--panel)}
table.tk .num{text-align:right;font-family:var(--mono);font-size:var(--fs12);color:var(--text2)}
table.tk .muted{color:var(--text3);font-size:var(--fs12)}
table.tk .link{color:var(--accent2)}
table.tk .rowact{width:28px;padding:0 4px;opacity:0}
table.tk tr:hover .rowact{opacity:1}
table.tk .rowact button{width:22px;height:22px;border-radius:var(--r4);display:grid;place-items:center;color:var(--text3)}
table.tk .rowact button:hover{background:var(--panel2);color:var(--text)}

/* ============================================================
   6. 模板信息卡
   ============================================================ */
.tplgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp3)}
.tplcard{
  background:var(--card2);border:1px solid var(--line);border-radius:var(--r10);overflow:hidden;
  box-shadow:var(--sh1);position:relative;transition:border-color .14s var(--ease),box-shadow .14s var(--ease),transform .14s var(--ease);
}
.tplcard:hover{border-color:var(--line2);box-shadow:var(--sh2);transform:translateY(-1px)}
.tplcard .info{padding:14px 12px 12px;position:relative}
.tplcard .info::before{content:"";position:absolute;left:0;right:0;top:-1px;height:4px;background:linear-gradient(90deg,#e2711d,#f6b26b)}
.tplcard .bl{display:flex;align-items:center;gap:6px;margin-bottom:9px}
.tplcard .bl .lg{width:15px;height:15px;border-radius:4px;background:linear-gradient(140deg,#3b82f6,#8b5cf6)}
.tplcard .bl .nm{font-size:10px;color:var(--text3);letter-spacing:.6px;font-weight:600}
.tplcard .bl .tag{margin-left:auto}
.tplcard .cat{font-size:21px;font-weight:800;line-height:1.15;letter-spacing:-.2px;margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tplcard .kv{display:grid;grid-template-columns:56px 1fr;gap:4px 8px;font-size:var(--fs12)}
.tplcard .kv .k{color:var(--text3)}
.tplcard .kv .v{color:var(--text);font-weight:500}
.tplcard .kv .v b{font-weight:700}
.tplcard .foot{background:var(--panel2);border-top:1px solid var(--line);padding:7px 12px 8px}
.tplcard .foot .fn{font-size:var(--fs12);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tplcard .foot .meta{font-size:10px;color:var(--text3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ============================================================
   7. 文件行
   ============================================================ */
.frow{
  display:grid;grid-template-columns:22px 28px minmax(0,1fr) 68px 26px;gap:9px;align-items:center;
  padding:9px var(--sp4);border-bottom:1px solid var(--line);position:relative;min-height:62px;
}
.frow > .tag{justify-self:end}
.frow:hover{background:var(--panel)}
.frow .ft{display:flex;flex-direction:column;gap:2px;min-width:0}
.frow .ft .n{font-size:var(--fs13);font-weight:600;display:flex;align-items:center;gap:6px;min-width:0}
.frow .ft .n span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .ft .p{font-size:10.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
.frow .ft .tags{display:flex;gap:4px;margin-top:1px;overflow:hidden;max-height:19px}
.frow .ft .tags .x{display:none;opacity:.6;margin-left:1px}
.frow:hover .ft .tags .x{display:inline}
.frow .more{opacity:0;width:22px;height:22px;border-radius:var(--r4);display:grid;place-items:center;color:var(--text3)}
.frow:hover .more{opacity:1}
.frow .more:hover{background:var(--panel2);color:var(--text)}
.ftype{
  width:26px;height:26px;border-radius:var(--r4);display:grid;place-items:center;
  background:var(--panel2);border:1px solid var(--line2);color:var(--text2);font-weight:700;
}
.frow:hover .ftype{color:var(--text);border-color:var(--text3)}
.chk{width:15px;height:15px;border-radius:3px;border:1px solid var(--line2);display:grid;place-items:center;color:transparent;background:var(--panel)}
.chk:hover{border-color:var(--text3)}
.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ============================================================
   8. 批量条（L2）
   ============================================================ */
.bulkbar{
  position:absolute;left:50%;bottom:20px;transform:translateX(-50%) translateY(8px);
  display:flex;align-items:center;gap:var(--sp2);padding:7px 9px 7px 14px;
  background:var(--card2);border:1px solid var(--accent2);border-radius:var(--r10);
  box-shadow:0 14px 40px rgba(0,0,0,.7),0 0 0 4px var(--accentSoft);opacity:0;pointer-events:none;transition:opacity .16s var(--ease),transform .16s var(--ease);
  z-index:20;white-space:nowrap;
}
.bulkbar.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
.bulkbar .n{font-size:var(--fs12);color:var(--text)}
.bulkbar .btn.sm{background:var(--panel);border-color:var(--line2)}
.bulkbar .btn.sm:hover{background:var(--card);border-color:var(--text3)}
.bulkbar .n b{color:var(--text);font-weight:700}
.bulkbar .div{width:1px;height:16px;background:var(--line2)}
.bulkbar .close{width:24px;height:24px;border-radius:var(--r4);display:grid;place-items:center;color:var(--text3)}
.bulkbar .close:hover{background:var(--panel2);color:var(--text)}

/* ============================================================
   9. 弹窗
   ============================================================ */
.mask{position:fixed;inset:0;background:var(--mask);display:grid;place-items:center;z-index:60;backdrop-filter:blur(1.5px)}
.modal{
  width:740px;max-height:84vh;background:var(--panel);border:1px solid var(--line2);
  border-radius:var(--r14);box-shadow:var(--sh2);display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;
}
.modal.wide{width:860px}
.mhead{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{font-size:var(--fs15);font-weight:700;letter-spacing:.1px}
.mhead .proj{font-size:var(--fs12);color:var(--accent2);background:var(--accentSoft);padding:2px 8px;border-radius:var(--r4)}

.switch{width:34px;height:19px;border-radius:999px;background:var(--line2);position:relative;flex:none}
.switch i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:left .14s var(--ease)}
.switch.on{background:var(--accent)}
.switch.on i{left:17px}

/* ============================================================
   10. 层级可视化
   ============================================================ */
body.layers .app{margin-top:22px;height:calc(100vh - 22px)}
body.layers [data-layer]:not(.bulkbar){outline:1.5px dashed var(--lc);outline-offset:-1px;position:relative;border-radius:var(--r4)}
body.layers .bulkbar[data-layer]{outline:1.5px dashed var(--lc);outline-offset:2px}
body.layers [data-layer]::before{
  content:attr(data-layer);position:absolute;left:-1px;top:-17px;z-index:99;
  font-size:10px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--lc);
  padding:2px 7px;border-radius:4px 4px 0 0;line-height:13px;pointer-events:none;
  box-shadow:0 -1px 0 rgba(0,0,0,.2);
}
body.layers [data-note]:hover::after{
  content:attr(data-note);position:absolute;left:0;top:100%;margin-top:2px;z-index:99;

  font-size:11px;padding:4px 8px;box-shadow:var(--sh2);white-space:nowrap;pointer-events:none;
}
.L0{--lc:#8b5cf6}.L1{--lc:#3b82f6}.L2{--lc:#e2711d}.L3{--lc:#14a3a3}

/* ============================================================

function cover(seed){
  const P = [
    {a:'#1b3a63',b:'#0b1626',fg:'#f0c260',word:'秋季招生',sub:'ENROLL 2026'},
    {a:'#0f5f5c',b:'#062926',fg:'#9fe8dd',word:'升学规划',sub:'SERVICE'},

    {a:'#7a3218',b:'#321105',fg:'#ffd0a3',word:'精英',sub:'POSTER SET'},
    {a:'#16233d',b:'#080e19',fg:'#8fb8ff',word:'规划中心',sub:'LONG PAGE'},
    {a:'#1e4632',b:'#091a12',fg:'#a8e6b8',word:'初三',sub:'TRAINING CAMP'}
  ][seed % 6];
  const g = 'g' + seed;
  return `<svg viewBox="0 0 400 220" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="${P.a}"/><stop offset="1" stop-color="${P.b}"/>
      </linearGradient>
      <radialGradient id="${g}r" cx=".74" cy=".26" r=".72">
        <stop offset="0" stop-color="${P.fg}" stop-opacity=".30"/><stop offset="1" stop-color="${P.fg}" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="400" height="220" fill="url(#${g})"/>
    <rect width="400" height="220" fill="url(#${g}r)"/>
    <circle cx="322" cy="58" r="52" fill="none" stroke="${P.fg}" stroke-opacity=".30" stroke-width="1"/>
    <circle cx="322" cy="58" r="34" fill="none" stroke="${P.fg}" stroke-opacity=".18" stroke-width="1"/>
    <path d="M246 118 L400 96" stroke="${P.fg}" stroke-opacity=".18" stroke-width="1"/>
    <path d="M246 130 L400 108" stroke="${P.fg}" stroke-opacity=".10" stroke-width="1"/>
    <text x="26" y="158" font-family="Microsoft YaHei,sans-serif" font-size="26" font-weight="800" fill="${P.fg}" letter-spacing="1">${P.word}</text>
    <text x="27" y="176" font-family="Microsoft YaHei,sans-serif" font-size="8.5" fill="${P.fg}" fill-opacity=".62" letter-spacing="2.4">${P.sub}</text>
    <rect x="26" y="186" width="26" height="1.6" fill="${P.fg}" fill-opacity=".5"/>
  </svg>`;
}

/* 通用库缩略图：logo / 版式 / 纹理 三种，各自长得像自己 */
function swatch(kind, seed){
  if (kind === 'logo') {
    const mark = ['◆','●','▲','✦'][seed % 4];
    return `<svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="ck${seed}" width="14" height="14" patternUnits="userSpaceOnUse">
        <rect width="14" height="14" fill="#1a1d22"/><rect width="7" height="7" fill="#20242a"/>
        <rect x="7" y="7" width="7" height="7" fill="#20242a"/>
      </pattern></defs>
      <rect width="200" height="130" fill="url(#ck${seed})"/>
      <circle cx="100" cy="55" r="24" fill="none" stroke="#e8eaee" stroke-width="1.6"/>
      <text x="100" y="63" text-anchor="middle" font-size="22" fill="#e8eaee">${mark}</text>
      <rect x="68" y="90" width="64" height="3.4" rx="1.7" fill="#e8eaee" fill-opacity=".8"/>
      <rect x="82" y="99" width="36" height="2" rx="1" fill="#e8eaee" fill-opacity=".35"/>
    </svg>`;
  }
  if (kind === 'texture') {
    const col = ['#8b5cf6','#3b82f6','#14a3a3','#e2711d'][seed % 4];
    return `<svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
      <defs><pattern id="p${seed}" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
        <line x1="0" y1="0" x2="0" y2="9" stroke="${col}" stroke-opacity=".55" stroke-width="1.6"/>
      </pattern></defs>
      <rect width="200" height="130" fill="#14161a"/>
      <rect width="200" height="130" fill="url(#p${seed})"/>
      <rect width="200" height="130" fill="url(#none)"/>
      <circle cx="150" cy="34" r="30" fill="${col}" fill-opacity=".22"/>
    </svg>`;
  }
  // 版式
  return `<svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg">
    <rect width="200" height="130" fill="#191c21"/>
    <rect x="20" y="16" width="160" height="22" rx="2" fill="#ffffff" fill-opacity=".10"/>
    <rect x="20" y="46" width="96" height="52" rx="2" fill="#3b82f6" fill-opacity=".22"/>
    <rect x="124" y="46" width="56" height="10" rx="2" fill="#ffffff" fill-opacity=".16"/>
    <rect x="124" y="62" width="56" height="6" rx="2" fill="#ffffff" fill-opacity=".10"/>
    <rect x="124" y="74" width="38" height="6" rx="2" fill="#ffffff" fill-opacity=".10"/>
    <rect x="20" y="106" width="52" height="8" rx="2" fill="#ffffff" fill-opacity=".10"/>
    <rect x="80" y="106" width="34" height="8" rx="2" fill="#ffffff" fill-opacity=".07"/>
  </svg>`;
}

/* ============================================================
   渲染
   ============================================================ */
let cur = 'cards';
function render(){
  const s = S[cur] || S.cards;
  document.getElementById('sider').innerHTML = s.sider ? s.sider() : '';
  document.getElementById('toolbar').innerHTML = s.toolbar ? s.toolbar() : '';
  const c = document.getElementById('content');
  const base = s.overlay ? S.cards : s;
  if (s.overlay) {
    document.getElementById('sider').innerHTML = base.sider();
    document.getElementById('toolbar').innerHTML = base.toolbar();
    c.innerHTML = base.content();
  } else {
    c.innerHTML = s.content ? s.content() : '';
  }
  c.scrollTop = 0;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on', b.dataset.s===cur));
  // 弹窗类
  const old = document.getElementById('overlay'); if(old) old.remove();
  if(s.overlay){
    const d = document.createElement('div'); d.id='overlay'; d.innerHTML = s.overlay();
    document.body.appendChild(d);
    // 关掉弹窗回到任务视图
    d.querySelectorAll('.iconbtn').forEach(b=>{ if(b.textContent.trim()==='✕') b.onclick=()=>{ d.remove(); go('cards') } });
    d.querySelectorAll('.mfoot .btn').forEach(b=>{ if(b.textContent.trim()==='关闭') b.onclick=()=>{ d.remove(); go('cards') } });
  }
  if(cur==='tickets'){ document.getElementById('tkbody').innerHTML = tkRows(); }
  const bar = document.getElementById('bulkbar');
  if(bar){
    bar.querySelectorAll('.btn.sm')[0].textContent = (cur==='files'||cur==='tpl') ? '移动到分组' : '打包交付';
    bar.querySelectorAll('.btn.sm')[1].textContent = (cur==='files'||cur==='tpl') ? '打标签' : '改归属';
    bar.querySelectorAll('.btn.sm')[2].style.display = (cur==='files'||cur==='tpl') ? 'none' : '';
    bar.classList.remove('show');
  }
  // 抽屉
  document.getElementById('drawerBody').innerHTML = renderOpts(s.opts||[]);
  // 状态条筛选名
  document.getElementById('stFilter').textContent =
    {cards:'全部任务',tickets:'我的工单',files:'全部文件',tpl:'全部模板',brand:'全部素材',detail:'全部任务',settings:'全部任务'}[cur] || '全部';
}
function renderOpts(list){
  if(!list.length) return '<div class="hint">这一屏没有单独列改动，主要是骨架层面的调整。</div>';
  return `<div class="dsec">本屏改动（点条目高亮）</div>` + list.map(o=>`
    <div class="ditem" data-k="${o[0]}">
      <span class="n">${o[0]}</span>
      <div><div class="t">${o[1]}</div><div class="d">${o[2]}</div></div>
    </div>`).join('');
}
function go(k){ cur = k; render(); if(k==='settings'||k==='detail') document.getElementById('drawer').classList.add('open'); }

/* 交互 */
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.s)));
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark = document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme', dark?'light':'dark');
  document.getElementById('themeTip').textContent = dark ? '深色' : '浅色';
});
document.getElementById('layerBtn').addEventListener('click',()=>{
  document.body.classList.toggle('layers');
  document.getElementById('layerBtn').classList.toggle('on');
});
const drawer = document.getElementById('drawer');
document.getElementById('optBtn').addEventListener('click',()=>drawer.classList.toggle('open'));
document.getElementById('drawerClose').addEventListener('click',()=>drawer.classList.remove('open'));

/* 演示：选中 3 项 → 批量条（只在任务/文件视图） */
document.getElementById('content').addEventListener('click',(e)=>{
  const chk = e.target.closest('.chk');
  if(chk){ chk.classList.toggle('on'); syncBulk(); }
});
function syncBulk(){
  const n = document.querySelectorAll('.chk.on').length;
  const bar = document.getElementById('bulkbar');
  if(!bar) return;
  bar.querySelector('b').textContent = n;
  bar.classList.toggle('show', n>0);
}
window.addEventListener('keydown',(e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); document.getElementById('gsearch').focus(); }
  if(e.key==='Escape'){ drawer.classList.remove('open'); const o=document.getElementById('overlay'); if(o){o.remove(); go('cards')} }
});

/* 演示开关：hash 写成 #cards!bulk!layers 即可初始就带批量条与层级框 */
function demoBulk(){
  const chks=[...document.querySelectorAll('.card .cover .chk')].slice(0,3);
  chks.forEach(c=>c.classList.add('on'));
  const bar=document.getElementById('bulkbar');
  if(bar){ bar.querySelector('b').textContent=chks.length; bar.classList.add('show'); }
}
const raw=(location.hash||'').replace('#','');
const parts=raw.split('!');
const h=parts[0];
if(S[h]) cur=h;
render();
if(parts.includes('bulk')) setTimeout(demoBulk, 120);
if(parts.includes('layers')){
  document.body.classList.add('layers');
  document.getElementById('layerBtn').classList.add('on');
  const bar=document.getElementById('bulkbar');
  if(parts.includes('bulk') && bar){ bar.setAttribute('data-layer','L2'); bar.setAttribute('data-note','L2 集合：选中才出现，贴在底部，不挤压内容'); }
}
window.addEventListener('hashchange',()=>{const k=(location.hash||'').replace('#','').split('!')[0]; if(S[k]) go(k)});
</script>
